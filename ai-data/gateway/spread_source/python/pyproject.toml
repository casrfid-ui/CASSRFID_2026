[project]
name = "spread-source"
version = "0.1.0"
description = "Gateway fire-spread isochrones (elliptical front, Dijkstra on a grid) and smoke-plume source localisation (Gaussian plume, Bayesian grid inversion)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../common/python/src"]
