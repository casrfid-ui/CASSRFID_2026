[project]
name = "gas-trend"
version = "0.1.0"
description = "Gateway gas early-warning model: last scans of one box (chain outputs) in, probability of smoke onset within H scans out."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["torch>=2.0", "scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../common/python/src", "../../../box/gas_chain/python/src"]
