[project]
name = "gw-common"
version = "0.1.0"
description = "Shared tools of the gateway prediction blocks: metrics with block bootstrap, numpy GRU, numpy message passing."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "scikit-learn>=1.3", "torch>=2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
