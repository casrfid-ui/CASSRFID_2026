[project]
name = "risk-gru"
version = "0.1.0"
description = "Gateway ignition-risk model: 14 days of weather and FWI codes in, risk of fire for the next 3 days out (GRU, numpy at run time)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
train = ["torch>=2.0", "scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../common/python/src", "../../../box/fwi/python/src"]
