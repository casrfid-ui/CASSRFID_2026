[project]
name = "gas-chain"
version = "0.1.0"
description = "Box gas processing chain (BME680): quality, filter, compensation, baseline, bands, score, class."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
eval = ["pandas>=2.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gas_chain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
